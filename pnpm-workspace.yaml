ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0

shamefullyHoist: true
strictPeerDependencies: false
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.20.0
  - '@pnpm/modules-yaml'
  - tinyexec@1.2.2

packages:
  - packages/*

refs:
  devframe: &devframe ^0.9.4
  nuxt-devtools: &nuxt-devtools ^4.0.0-alpha.12
  vite-devtools: &vite-devtools ^0.5.1

overrides:
  # Keep the whole @devframes/* ecosystem (the inspector's own devframe and
  # @nuxt/devtools' bundled hub + plugins) on one 0.9.x line. @nuxt/devtools
  # >= 4.0.0-alpha.11 is the first release built on the 0.9 hub API
  # (initHub/initDevframe + ctx.install); earlier alphas import the removed
  # mountDevframe/createHubContext and break against hub 0.9.
  '@devframes/hub': *devframe
  '@nuxt/devtools': *nuxt-devtools
  '@nuxt/devtools-kit': *nuxt-devtools
  '@vitejs/devtools': *vite-devtools
  '@vitejs/devtools-kit': *vite-devtools
  '@vitejs/devtools-rolldown': *vite-devtools
  chokidar: 5.0.0
  devframe: *devframe
  semver: 7.8.0

patchedDependencies:
  '@nuxt/nitro-server-nightly@5.0.0-29666842.2bab300c': patches/@nuxt__nitro-server-nightly@5.0.0-29666842.2bab300c.patch

