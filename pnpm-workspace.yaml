minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
minimumReleaseAge: 0

packages:
  - packages/*

shamefullyHoist: true
strictPeerDependencies: false
shellEmulator: true
ignoreWorkspaceRootCheck: true

trustPolicyExclude:
  - undici-types@6.20.0
  - '@pnpm/modules-yaml'
  - tinyexec@1.2.2

overrides:
  '@devframes/hub': &devframe ^0.9.18
  '@nuxt/devtools': &nuxt-devtools ^4.0.0-alpha.18
  '@nuxt/devtools-kit': *nuxt-devtools
  # @antfu/design pins its own unocss preset deps (^66.7.2), which resolve to
  # a separate @unocss/core than the one used by @unocss/nuxt (66.10.1),
  # producing a duplicate that breaks unocss's TS types. Force one version.
  '@unocss/core': &unocss ^66.10.1
  '@unocss/preset-icons': *unocss
  '@unocss/preset-mini': *unocss
  '@unocss/preset-web-fonts': *unocss
  '@unocss/preset-wind3': *unocss
  '@unocss/preset-wind4': *unocss
  '@unocss/transformer-directives': *unocss
  '@vitejs/devtools': &vite-devtools ^0.7.3
  '@vitejs/devtools-kit': *vite-devtools
  '@vitejs/devtools-rolldown': *vite-devtools
  chokidar: 5.0.0
  devframe: *devframe
  semver: 7.8.0
  unocss: *unocss

catalogs:
  bundling:
    '@rollup/plugin-alias': ^6.0.0
    '@rollup/plugin-commonjs': ^29.0.3
    '@rollup/plugin-node-resolve': ^16.0.3
    '@unocss/nuxt': ^66.10.1
    '@vueuse/nuxt': ^14.4.0
    esbuild: ^0.28.2
    nuxt: npm:nuxt-nightly@5x
    rollup: ^4.63.1
    rollup-plugin-esbuild: ^6.2.1
    unbuild: ^3.6.1
    vite: ^8.2.2
  deps:
    '@modelcontextprotocol/sdk': ^1.30.0
    ansis: ^4.3.1
    cac: ^7.0.0
    devframe: *devframe
    fast-npm-meta: ^2.2.0
    h3: ^2.0.1-rc.31
    js-yaml: ^5.4.1
    launch-editor: ^2.14.1
    ohash: ^2.0.12
    open: ^11.0.2
    p-limit: ^7.3.2
    package-manager-detector: ^1.8.0
    pathe: ^2.0.3
    publint: ^0.3.24
    stream-json: ^3.6.0
    structured-clone-es: ^2.0.1
    tinyexec: ^1.3.1
    tinyglobby: ^0.2.17
    unconfig: ^7.5.0
    unstorage: ^1.17.5
    valibot: ^1.5.0
    verkit: ^0.4.0
  dev:
    '@antfu/design': ^0.4.0
    '@antfu/ni': ^30.5.0
    '@nuxt/devtools': *nuxt-devtools
    bumpp: ^12.3.0
    colorjs.io: ^0.7.1
    skills-npm: ^1.2.1
    typescript: ^6.0.3
    vite-plugin-inspect: ^12.0.2
    vue-tsc: ^3.3.11
  frontend:
    '@vitejs/plugin-vue': ^6.0.8
    '@webcontainer/api': ^1.6.4
    '@xterm/addon-fit': ^0.11.0
    '@xterm/xterm': ^6.0.0
    d3: ^7.9.0
    d3-hierarchy: ^3.1.2
    d3-shape: ^3.2.0
    floating-vue: ^5.4.0
    fuse.js: ^7.5.0
    idb-keyval: ^6.3.0
    modern-screenshot: ^4.7.0
    nanovis: ^1.1.0
    reka-ui: ^2.10.4
    theme-vitesse: ^1.0.0
    vite-hot-client: ^2.2.0
  icons:
    '@iconify-json/carbon': ^1.2.26
    '@iconify-json/catppuccin': ^1.2.17
    '@iconify-json/logos': ^1.2.14
    '@iconify-json/ph': ^1.2.2
    '@iconify-json/ri': ^1.2.10
    '@iconify-json/simple-icons': ^1.2.95
  inlined:
    '@antfu/utils': ^9.3.0
  lint:
    '@antfu/eslint-config': ^9.5.1
    '@nuxt/eslint': ^1.17.0
    '@typescript-eslint/utils': ^8.70.0
    '@unocss/eslint-config': ^66.10.1
    eslint: ^10.10.0
    nano-staged: ^1.0.2
    nuxt-eslint-auto-explicit-import: ^0.2.0
    simple-git-hooks: ^2.14.0
  storybook:
    '@storybook/addon-docs': ^10.6.0
    '@storybook/vue3-vite': ^10.6.0
    storybook: ^10.6.0
  testing:
    '@axe-core/playwright': ^4.13.0
    '@playwright/test': ^1.63.0
    '@valibot/to-json-schema': ^1.7.1
    mlly: ^1.8.2
    type-fest: 4.41.0
    vitest: ^5.0.0
  types:
    '@pnpm/list': ^1000.3.4
    '@pnpm/types': ^1102.1.0
    '@types/d3': ^7.4.3
    '@types/d3-hierarchy': ^3.1.7
    '@types/js-yaml': ^4.0.9
    '@types/stream-json': ^1.7.8
    pkg-types: ^2.3.3

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

update:
  ignoreDeps:
    - typescript@7
